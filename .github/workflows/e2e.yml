name: e2e
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One runner per engine; web/playwright.config.ts says why.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm --prefix web ci
      - run: npx --prefix web playwright install --with-deps chromium ${{ matrix.engine }} # setup signs in with Chromium
      - run: npm --prefix web run ${{ matrix.engine == 'chromium' && 'e2e' || 'e2e:webkit' }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ matrix.engine }}
          path: web/test-results/
