<div class="docs">
  <aside class="docs-side" aria-label="Documentation">
    <button class="side-toggle" type="button" aria-expanded="false" aria-controls="docs-nav">Browse the docs</button>
    <nav id="docs-nav" class="docs-nav">{{SIDEBAR}}</nav>
  </aside>
  <article class="docs-main prose">
    <p class="eyebrow">{{GROUP}}</p>
    <h1>{{TITLE}}</h1>
    {{CONTENT}}
    <p class="edit"><a href="{{EDIT}}" rel="noopener">Edit this page</a></p>
    {{PAGER}}
  </article>
  <aside class="docs-toc" aria-label="On this page">{{TOC}}</aside>
</div>
