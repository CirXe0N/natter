# Local NATS server for manually testing Natter.
#   docker compose up -d
# Client: nats://127.0.0.1:4222   Monitoring: http://127.0.0.1:8222
services:
  nats:
    image: nats:latest
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data

volumes:
  nats-data:
